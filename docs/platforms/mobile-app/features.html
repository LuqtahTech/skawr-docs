<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Application (Deprecated) - Skawr Documentation</title>
    <link rel="stylesheet" href="../../gitbook-style.css">
    <link rel="icon" type="image/x-icon" href="../../favicon.ico">
    <style>
        .deprecation-notice {
            background: #fef3c7;

            border-radius: 12px;
            padding: 2rem;
            margin: 3rem auto;
            max-width: 600px;
            text-align: center;
        }
        .deprecation-notice h1 {
            color: #d97706;
            margin-bottom: 1rem;
        }
        .deprecation-notice p {
            color: #92400e;
            line-height: 1.6;
        }
    </style>

<body>
    <div class="book">
        <div class="book-body">
            <div class="body-inner">
                <div class="page-wrapper">
                    <div class="page-inner">
                        <div class="deprecation-notice">
                            <h1>⚠️ Mobile App — Decommissioned</h1>
                            <p>
                                The Skawr Marketplace iOS app has been <strong>removed from the App Store</strong> and is no longer active.
                            </p>
                            <p>
                                The marketplace experience is now web-only at <a href="https://skawr.com">skawr.com</a>.
                            </p>
                            <p>
                                For the current platform architecture, see the
                                <a href="../features-overview.html">Platform Features Overview</a>.
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</html>
